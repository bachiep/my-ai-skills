name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run skill test suite
        run: python3 -m unittest discover -s tests -v

      - name: Smoke-test install script
        run: ./install.sh --target /tmp/skill-install-test && ls /tmp/skill-install-test
